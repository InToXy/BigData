services:
  # ============================================================
  # MINIO - Data Lake
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: chu_minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /mnt/e/Bigdata:/data
    networks:
      - bigdata_network
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: chu_minio_setup
    depends_on:
      - minio
    env_file:
      - .env
    networks:
      - bigdata_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/bronze || true;
      /usr/bin/mc mb myminio/silver || true;
      /usr/bin/mc mb myminio/gold || true;
      /usr/bin/mc mb myminio/warehouse || true;
      /usr/bin/mc mb myminio/airflow-logs || true;
      echo 'Buckets MinIO créés';
      exit 0;
      "

  # ============================================================
  # POSTGRESQL - Base de données source
  # ============================================================
  bigdata_postgres:
    image: postgres:15-alpine
    container_name: chu_postgres_data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    restart: unless-stopped

  postgres_init_db:
    image: postgres:15-alpine
    container_name: chu_postgres_init_db
    depends_on:
      - bigdata_postgres
    volumes:
      - ./data/source/DATA2023:/tmp/data2023_avec_deces.dump
    networks:
      - bigdata_network
    command: >
      bash -c "
      until pg_isready -h bigdata_postgres -p 5432 -U admin -d healthcare_data; do 
        echo 'Waiting for PostgreSQL to be ready...'; 
        sleep 2; 
      done; 
      echo 'PostgreSQL is ready. Importing data...'; 
      PGPASSWORD=admin123 psql -h bigdata_postgres -p 5432 -U admin -d postgres -c \"SELECT pg_terminate_backend(pg_stat_activity.pid) FROM pg_stat_activity WHERE pg_stat_activity.datname = 'healthcare_data' AND pid <> pg_backend_pid();\" &&
      PGPASSWORD=admin123 psql -h bigdata_postgres -p 5432 -U admin -d postgres -c \"CREATE ROLE postgres WITH SUPERUSER LOGIN PASSWORD 'admin123';\" 2>/dev/null || true &&
      PGPASSWORD=admin123 dropdb --if-exists -h bigdata_postgres -p 5432 -U admin healthcare_data &&
      PGPASSWORD=admin123 createdb -h bigdata_postgres -p 5432 -U admin healthcare_data &&
      PGPASSWORD=admin123 pg_restore -v -h bigdata_postgres -p 5432 -U admin -d healthcare_data /tmp/data2023_avec_deces.dump &&
      echo 'Data import complete.'"
    restart: "no"

