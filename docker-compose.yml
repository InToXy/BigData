  # ============================================================
  # SUPERSET
  # ============================================================
  superset-db:
      image: postgres:15-alpine
      container_name: chu_superset_db
      env_file:
        - .env
      environment:
        POSTGRES_USER: ${SUPERSET_USER}
        POSTGRES_PASSWORD: ${SUPERSET_PASSWORD}
        POSTGRES_DB: ${SUPERSET_DB}
      volumes:
        - superset_db_data:/var/lib/postgresql/data
      networks:
        - bigdata_network
      restart: unless-stopped

  superset-init:
      image: apache/superset:3.0.0
      container_name: chu_superset_init
      depends_on:
        - superset-db
      environment:
        SUPERSET_CONFIG_PATH: /app/superset_home/superset_config.py
      volumes:
        - ./superset:/app/superset_home
      networks:
        - bigdata_network
      restart: "no"
      command: |
        bash -c "
          pip install trino[sqlalchemy]
          echo 'Initialisation de Superset...'
          sleep 15
          superset db upgrade
          superset fab create-admin --username admin --firstname Admin --lastname User --email admin@chu.com --password admin123 || echo 'Admin already exists'
          superset init
          echo 'Initialisation terminée!'
        "

  superset:
    image: apache/superset:3.0.0
    container_name: chu_superset
    depends_on:
      - superset-init
      - trino
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - ./superset:/app/superset_home
    networks:
      - bigdata_network
    restart: unless-stopped
    command: bash -c "pip install trino[sqlalchemy] && /usr/bin/run-server.sh"
# ============================================================
volumes:
  minio_data:
  airflow_db_data:
  superset_db_data:
  postgres_data:

# ============================================================
# RÉSEAU
# ============================================================
networks:
  bigdata_network:
    name: bigdata_network
    driver: bridge
