  # ============================================================
  # JUPYTER LAB
  # ============================================================
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: chu_jupyter
    env_file:
      - .env
    depends_on:
      - minio
      - bigdata_postgres
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
    ports:
      - "8888:8888"
    volumes:
      - ./spark_jobs:/home/jovyan/jobs
      - ./jupyter/notebooks:/home/jovyan/work
      - ./data:/data
      - ./jars:/home/jovyan/jars
    networks:
      - bigdata_network
    restart: unless-stopped
    command: start-notebook.sh --NotebookApp.token='admin123' --NotebookApp.password=''

  # ============================================================
  # SUPERSET 
  # ============================================================
  superset-db:
      image: postgres:15-alpine
      container_name: chu_superset_db
      environment:
        POSTGRES_USER: superset
        POSTGRES_PASSWORD: superset123
        POSTGRES_DB: superset
      volumes:
        - superset_db_data:/var/lib/postgresql/data
      networks:
        - bigdata_network
      restart: unless-stopped

  superset-init:
      image: apache/superset:3.0.0
      container_name: chu_superset_init
      depends_on:
        - superset-db
      environment:
        SQLALCHEMY_DATABASE_URI: "postgresql://superset:superset123@superset-db:5432/superset"
        SUPERSET_SECRET_KEY: 'thisISaSECRET_1234567890abcdefghijklmnopqrstuvwxyz'
      networks:
        - bigdata_network
      restart: "no"
      command: |
        bash -c "
          echo 'Initialisation de Superset...'
          sleep 15
          superset db upgrade
          superset fab create-admin --username admin --firstname Admin --lastname User --email admin@chu.com --password admin123
          superset init
          echo 'Initialisation terminée!'
        "

  superset:
    image: apache/superset:3.0.0
    container_name: chu_superset
    depends_on:
      - superset-init
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://superset:superset123@superset-db:5432/superset"
      SUPERSET_SECRET_KEY: 'thisISaSECRET_1234567890abcdefghijklmnopqrstuvwxyz'
    ports:
      - "8088:8088"
    volumes:
      - ./superset:/app/superset_home
    networks:
      - bigdata_network
    restart: unless-stopped
    command: /usr/bin/run-server.sh
# ============================================================
volumes:
  minio_data:
  airflow_db_data:
  superset_db_data:
  postgres_data:

# ============================================================
# RÉSEAU
# ============================================================
networks:
  bigdata_network:
    name: bigdata_network
    driver: bridge
