  # ============================================================
  # JUPYTER LAB
  # ============================================================
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: chu_jupyter
    env_file:
      - .env
    depends_on:
      - minio
      - bigdata_postgres
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
    ports:
      - "8888:8888"
    volumes:
      - ./spark_jobs:/home/jovyan/jobs
      - ./jupyter/notebooks:/home/jovyan/work
      - ./data:/data
      - ./jars:/home/jovyan/jars
    networks:
      - bigdata_network
    restart: unless-stopped
    command: start-notebook.sh --NotebookApp.token='admin123' --NotebookApp.password=''

  # ============================================================
  # TRINO - SQL Query Engine
  # ============================================================
  trino:
    image: 'trinodb/trino:351'
    container_name: chu_trino
    depends_on:
      - minio
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc:/usr/lib/trino/etc:ro
    env_file:
      - .env
    environment:
      TRINO_ENVIRONMENT: ${TRINO_ENVIRONMENT}
    networks:
      - bigdata_network
    restart: unless-stopped

  mariadb:
    hostname: mariadb
    image: mariadb:10.5.8
    ports:
      - 3306:3306
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - bigdata_network

  hive-metastore:
    hostname: hive-metastore
    image: 'bitsondatadev/hive-metastore:latest'
    ports:
      - '9083:9083' # Metastore Thrift
    volumes:
      - ./hive/conf/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
    env_file:
      - .env
    environment:
      METASTORE_DB_HOSTNAME: ${METASTORE_DB_HOSTNAME}
    depends_on:
      - mariadb
    networks:
      - bigdata_network

