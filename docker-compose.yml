version: '3.8'

services:
  # ============================================================
  # MINIO - Data Lake (Bronze, Silver, Gold)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: chu_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Configuration initiale MinIO
  minio-setup:
    image: minio/mc:latest
    container_name: chu_minio_setup
    depends_on:
      - minio
    networks:
      - bigdata_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/bronze || true;
      /usr/bin/mc mb myminio/silver || true;
      /usr/bin/mc mb myminio/gold || true;
      echo '✅ Buckets MinIO créés (bronze, silver, gold)';
      exit 0;
      "

  # ============================================================
  # POSTGRESQL - Base de données source
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: chu_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: healthcare_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d healthcare_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # HIVE METASTORE - Référentiel des tables et schémas
  # ============================================================
  metastore-db:
    image: postgres:15-alpine
    container_name: chu_metastore_db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
      POSTGRES_DB: metastore
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: chu_hive_metastore
    depends_on:
      - metastore-db
      - minio
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
        -Dfs.s3a.access.key=minioadmin
        -Dfs.s3a.secret.key=minioadmin123
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.connection.ssl.enabled=false
    ports:
      - "9083:9083"
    networks:
      - bigdata_network
    restart: unless-stopped

  # ============================================================
  # JUPYTER + SPARK - Traitement des données
  # ============================================================
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: chu_jupyter
    depends_on:
      - minio
      - postgres
      - hive-metastore
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
      # Configuration Spark
      SPARK_OPTS: >-
        --conf spark.hadoop.fs.s3a.access.key=minioadmin
        --conf spark.hadoop.fs.s3a.secret.key=minioadmin123
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        --conf spark.sql.catalogImplementation=hive
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./spark_jobs:/home/jovyan/jobs
      - ./jupyter/notebooks:/home/jovyan/work
      - ./data:/data
      - ./jars:/home/jovyan/jars
    networks:
      - bigdata_network
    restart: unless-stopped
    command: start-notebook.sh --NotebookApp.token='admin123' --NotebookApp.password=''

  # ============================================================
  # TRINO - Moteur de requêtes SQL
  # ============================================================
  trino:
    image: trinodb/trino:435
    container_name: chu_trino
    depends_on:
      - hive-metastore
      - minio
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # SUPERSET - Visualisation de données
  # ============================================================
  superset-db:
    image: postgres:15-alpine
    container_name: chu_superset_db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
      POSTGRES_DB: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  superset:
    image: apache/superset:3.0.0
    container_name: chu_superset
    depends_on:
      - superset-db
      - trino
    environment:
      SUPERSET_SECRET_KEY: 'thisISaSECRET_1234567890abcdefghijklmnopqrstuvwxyz'
      SQLALCHEMY_DATABASE_URI: 'postgresql://superset:superset123@superset-db:5432/superset'
    ports:
      - "8088:8088"
    volumes:
      - ./superset/config:/app/superset_home
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    command: >
      bash -c "
        pip install psycopg2-binary trino &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@chu.com --password admin123 || true &&
        superset init &&
        /usr/bin/run-server.sh
      "

  # ============================================================
  # AIRFLOW - Orchestrateur de workflows
  # ============================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: chu_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.7.3-python3.11
    container_name: chu_airflow_init
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin123
    networks:
      - bigdata_network
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin123 \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@chu.com || true
        echo "✅ Airflow initialized"

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.11
    container_name: chu_airflow_webserver
    depends_on:
      - airflow-db
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__WEBSERVER__SECRET_KEY: thisISaSECRET_1234567890
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    command: webserver
    user: root

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.11
    container_name: chu_airflow_scheduler
    depends_on:
      - airflow-db
      - airflow-init
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata_network
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    command: scheduler
    user: root

# ============================================================
# VOLUMES
# ============================================================
volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  metastore_db_data:
    driver: local
  superset_db_data:
    driver: local
  airflow_db_data:
    driver: local

# ============================================================
# RÉSEAU
# ============================================================
networks:
  bigdata_network:
    name: bigdata_network
    driver: bridge
