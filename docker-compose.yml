services:
  # ============================================================
  # MINIO - Data Lake
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: chu_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata_network
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: chu_minio_setup
    depends_on:
      - minio
    networks:
      - bigdata_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/bronze || true;
      /usr/bin/mc mb myminio/silver || true;
      /usr/bin/mc mb myminio/gold || true;
      /usr/bin/mc mb myminio/airflow-logs || true;
      echo 'Buckets MinIO créés';
      exit 0;
      "

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: chu_redis
    ports:
      - "6379:6379"
    networks:
      - bigdata_network
    restart: unless-stopped

  # ============================================================
  # AIRFLOW
  # ============================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: chu_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: chu_airflow_init
    environment:
      AIRFLOW_UID: '1000'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: 'UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres apache-airflow-providers-amazon pandas pyarrow boto3 psycopg2-binary s3fs
    depends_on:
      - airflow-db
    networks:
      - bigdata_network
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@chu.com || true
      "

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: chu_airflow_webserver
    depends_on:
      - airflow-init
      - minio
    environment:
      AIRFLOW_UID: '1000'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: 'UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      # Connexion au PostgreSQL EXISTANT (bigdata_postgres)
      AIRFLOW_CONN_POSTGRES_CHU: postgresql://admin:admin123@bigdata_postgres:5432/healthcare_data
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres apache-airflow-providers-amazon pandas pyarrow boto3 psycopg2-binary s3fs
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
    networks:
      - bigdata_network
    restart: unless-stopped
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: chu_airflow_scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW_UID: '1000'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: 'UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONN_POSTGRES_CHU: postgresql://admin:admin123@bigdata_postgres:5432/healthcare_data
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres apache-airflow-providers-amazon pandas pyarrow boto3 psycopg2-binary s3fs
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
    networks:
      - bigdata_network
    restart: unless-stopped
    command: airflow scheduler

  # ============================================================
  # JUPYTER LAB
  # ============================================================
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: chu_jupyter
    env_file:
      - .env
    depends_on:
      - minio
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
    ports:
      - "8888:8888"
    volumes:
      - ./spark_jobs:/home/jovyan/jobs
      - ./jupyter/notebooks:/home/jovyan/work
      - ./data:/data
      - ./jars:/home/jovyan/jars
    networks:
      - bigdata_network
    restart: unless-stopped
    command: start-notebook.sh --NotebookApp.token='admin123' --NotebookApp.password=''

  # ============================================================
  # SUPERSET
  # ============================================================
  superset-db:
    image: postgres:15-alpine
    container_name: chu_superset_db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
      POSTGRES_DB: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    networks:
      - bigdata_network
    restart: unless-stopped

  superset:
    image: apache/superset:3.0.0
    container_name: chu_superset
    depends_on:
      - superset-db
    environment:
      SUPERSET_SECRET_KEY: 'thisISaSECRET_1234567890abcdefghijklmnopqrstuvwxyz'
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: superset-db
      DATABASE_PORT: 5432
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset123
    ports:
      - "8088:8088"
    volumes:
      - ./superset/config:/app/superset_home
    networks:
      - bigdata_network
    restart: unless-stopped
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@chu.com --password admin123 || true &&
        superset init &&
        /usr/bin/run-server.sh
      "

volumes:
  minio_data:
  airflow_db_data:
  superset_db_data:

# ============================================================
# RÉSEAU
# ============================================================
networks:
  bigdata_network:
    name: bigdata_network
    driver: bridge