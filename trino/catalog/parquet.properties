connector.name=hive

# File-based metastore (no Hive server needed)
hive.metastore=file
hive.metastore.catalog.dir=s3a://gold/metastore/hive

# Enable native S3 file system
fs.native-s3.enabled=true

# MinIO/S3 configuration
s3.endpoint=http://minio:9000
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123
s3.path-style-access=true
s3.region=us-east-1
